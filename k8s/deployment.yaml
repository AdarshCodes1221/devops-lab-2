apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-encoder
  labels:
    app: media-encoder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-encoder
  template:
    metadata:
      labels:
        app: media-encoder
    spec:
      containers:
        - name: media-encoder
          image: video-encoder:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: media-encoder-svc
  labels:
    app: media-encoder
spec:
  type: NodePort
  selector:
    app: media-encoder
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30097
